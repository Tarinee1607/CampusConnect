<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    
    <link rel="stylesheet" href="../../assets/css/auth.css">
</head>
<body>

<div class="container-fluid">
    <div class="row min-vh-100">

        <!-- Left Panel -->
        <div class="col-lg-5 left-panel d-none d-lg-flex">
            <div class="content">
                <h1>CampusConnect</h1>
                <p>
                    Join the university placement portal to access placement
                    drives, manage applications, track interviews,
                    and stay updated with important notices.
                </p>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="col-lg-7 d-flex align-items-center justify-content-center">

            <div class="register-card">

                <h2 class="mb-2">Create Account</h2>

                <p class="text-muted mb-4">
                    Register to get started
                </p>

                <form action="../../../auth/register.php" method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input
    type="text"
    name="fullname"
    class="form-control"
    placeholder="Enter your name"
    required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Roll Number</label>
                            <input
    type="text"
    name="rollno"
    class="form-control"
    placeholder="Enter roll number"
    required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Branch</label>

                            <select class="form-select" name="branch" required>
                                <option selected disabled>Select Branch</option>
                                <option>CSE</option>
                                <option>AI & DS</option>
                                <option>IT</option>
                                <option>ECE</option>
                                <option>EEE</option>
                                <option>ME</option>
                                <option>CE</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Graduation Year</label>

                            <select class="form-select" name="graduation_year" required>
                                <option selected disabled>Select Year</option>
                                <option>2026</option>
                                <option>2027</option>
                                <option>2028</option>
                                <option>2029</option>
                            </select>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">CGPA</label>

                        <input
    type="number"
    step="0.01"
    min="0"
    max="10"
    name="cgpa"
    class="form-control"
    placeholder="Enter CGPA"
    required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">University Email</label>

                        <input
    type="email"
    name="email"
    class="form-control"
    placeholder="Enter university email"
    required>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password</label>

                            <input
    type="password"
    name="password"
    class="form-control"
    placeholder="Password"
    required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirm Password</label>

                            <input
    type="password"
    name="confirm_password"
    class="form-control"
    placeholder="Confirm Password"
    required>
                        </div>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100 login-btn">
                        Create Account
                    </button>

                </form>

                <div class="text-center mt-4">

                    Already have an account?

                    <a href="login.php" class="register-link">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
